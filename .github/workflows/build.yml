
name: Build C++ EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Check Files
        shell: cmd
        run: dir /s /b *.cpp

      - name: Compile C++
        shell: cmd
        run: |
          cl /EHsc /std:c++17 /O2 okta_mini_kasir.cpp /Fe:program.exe
          if errorlevel 1 exit /b 1

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: program-exe
          path: program.exe
